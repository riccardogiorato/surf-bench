<text x="16" y="24" font-family="Verdana,Arial,sans-serif" font-size="15" font-weight="bold" fill="#ffffff">SurfBench — The Web Access Benchmark</text>
<rect x="14" y="44" width="1072" height="320" fill="#ffffff" stroke="#808080"/>
<text x="36" y="92" font-family="Verdana,Arial,sans-serif" font-size="34" font-weight="bold" fill="#111111">SurfBench</text>
<text x="36" y="126" font-family="Verdana,Arial,sans-serif" font-size="15" fill="#444444">The benchmark that hires the best web assistant for your agent.</text>
<text x="36" y="164" font-family="Verdana,Arial,sans-serif" font-size="14" fill="#111111">Events: search / scrape / quest</text>
<text x="36" y="190" font-family="Verdana,Arial,sans-serif" font-size="13" fill="#111111">Providers: firecrawl exa linkup tavily parallel jina brave serper</text>
<text x="36" y="216" font-family="Verdana,Arial,sans-serif" font-size="14" fill="#111111">Judges: Kimi K3 + GLM-5 via Together AI</text>
<text x="36" y="242" font-family="Verdana,Arial,sans-serif" font-size="13" fill="#111111">30s wipeout rule: slow is a DQ, not a data point</text>
<rect x="36" y="270" width="440" height="30" fill="#ffffff" stroke="#808080"/>
<text x="48" y="290" font-family="Verdana,monospace" font-size="13" fill="#444444">which provider should my agent use?</text>
<rect x="488" y="270" width="84" height="30" fill="#c0c0c0" stroke="#0a0a0a"/>
<text x="506" y="290" font-family="Verdana,Arial,sans-serif" font-size="13" fill="#111111">Surf!</text>
<rect x="36" y="316" width="1050" height="8" fill="#ffd800"/>
<text x="36" y="352" font-family="Verdana,monospace" font-size="12" fill="#000080">*** SEARCH: tavily fastest *** SCRAPE: parallel most waves *** QUEST: see results/ ***</text>
